name: Regenerate Property Pages

on:
  schedule:
    # Every hour at :05 past the hour
    - cron: '5 * * * *'
  workflow_dispatch:   # allow manual trigger from Actions tab

permissions:
  contents: write      # needed to push generated pages back

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write service account key
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}" | base64 -d > service-account.json

      - name: Generate pages
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GOOGLE_APPLICATION_CREDENTIALS: ./service-account.json
        run: node generate-all.js

      - name: Commit and push changes
        run: |
          git config user.name  "rentspace-bot"
          git config user.email "bot@rentspace.co.ke"
          git add property/ airbnb/ sitemap.xml
          if git diff --staged --quiet; then
            echo "✅ No changes to commit."
          else
            git commit -m "Auto: regenerate property pages [skip ci]"
            git push
            echo "✅ Changes committed and pushed."
          fi

      - name: Cleanup
        if: always()
        run: rm -f service-account.json
