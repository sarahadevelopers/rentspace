<style>

      align-items: center;
      justify-content: center;
      padding: 40px 20px;

    .login-card {

      border-radius: 16px;
      border: 1px solid #2c2c2c;

    @keyframes fadeUp {

    .login-card .icon {
      text-align: center;

      color: #c5a059;
      margin-bottom: 8px;

    .login-card h1 {
      text-align: center;
      font-size: 28px;

      color: #eaeaea;
      margin-bottom: 4px;
    }
    .login-card .subtitle {
      text-align: center;
      color: #888;
      font-size: 15px;
      margin-bottom: 28px;
    }
    .login-card .form-group { margin-bottom: 18px; }
    .login-card label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #eaeaea;
      font-size: 14px;
    }
    .login-card input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #2c2c2c;
      border-radius: 8px;
      font-size: 16px;
      background: #0d0d0d;
      color: #eaeaea;
      font-family: 'Jost', sans-serif;
      transition: border-color 0.3s;
    }
    .login-card input:focus {

      outline: none;

    }
    .login-card input::placeholder { color: #555; }
    .login-card .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 6px 0 20px;
      font-size: 14px;
    }
    .login-card .form-options a {
      color: #c5a059;
      text-decoration: none;
      font-weight: 500;
    }
    .login-card .form-options a:hover { text-decoration: underline; }
    .login-card .btn-login {
      width: 100%;
      padding: 14px;
      background: #c5a059;
      color: #0d0d0d;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
      font-family: 'Jost', sans-serif;
    }
    .login-card .btn-login:hover { background: #d4b37a; }
    .login-card .btn-login:active { transform: scale(0.98); }
    .login-card .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .login-card .signup-link {
      text-align: center;
      margin-top: 20px;
      color: #888;
      font-size: 15px;
    }
    .login-card .signup-link a {
      color: #c5a059;
      font-weight: 600;
      text-decoration: none;
    }
    .login-card .signup-link a:hover { text-decoration: underline; }
    .login-card .back-home {
      text-align: center;
      margin-top: 12px;
    }
    .login-card .back-home a {
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }
    .login-card .back-home a:hover { color: #c5a059; }

    /* ─── Divider (OR) ─── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0 16px;
    }
    .divider hr {

      border: none;
      border-top: 1px solid #2c2c2c;
    }
    .divider span {

    /* ─── Google Button ─── */

      align-items: center;

    /* ─── Error Message ─── */

    /* ─── Responsive ─── */
    @media (max-width: 600px) {

<!-- ===== HEADER ===== -->
<header class="rentspace-header">

<!-- ===== LOGIN FORM ===== -->
<main class="login-wrapper">

    <form id="loginForm">

    <!-- Google Sign-In -->
    <div class="divider">

    </div>
    <a href="https://rentspace-markeplace.onrender.com/api/auth/google" class="btn-google">

        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
        <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>

<!-- ===== JAVASCRIPT ===== -->
<script>
// ─── Google OAuth callback handler ──────────────────────────
// Runs immediately on page load if URL has ?token=... from Google
// ─── Google OAuth callback handler ──────────────────────────
// Runs immediately on page load if URL has ?token=... from Google
(function handleGoogleCallback() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const error = params.get('error');
  const verified = params.get('verified');
  const errorBox = document.getElementById('errorBox');
  const successBox = document.getElementById('successBox');

  // ─── Priority 1: error from Google ──────────────────────
  if (error) {
    if (errorBox) {
      errorBox.textContent = 'Google sign-in failed. Please try again or use email login.';
      errorBox.style.display = 'block';
    }
    window.history.replaceState({}, '', window.location.pathname);
    return;
  }

  // ─── Priority 2: token from Google (log user in) ────────
  if (token) {
    const user = {
      id: params.get('id'),
      email: params.get('email'),
      name: params.get('name'),
      phone: params.get('phone'),
      role: params.get('role'),
      subscriptionPlan: params.get('subscriptionPlan'),
      verified: params.get('verified') === 'true'
    };

    try {
      localStorage.setItem('rentspace_token', token);
      localStorage.setItem('rentspace_user', JSON.stringify(user));
      if (successBox) {
        successBox.textContent = '🎉 Signed in with Google! Redirecting...';
        successBox.style.display = 'block';
      }
      window.history.replaceState({}, '', window.location.pathname);
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 600);
    } catch (err) {
      console.error('Failed to save Google session:', err);
      if (errorBox) {
        errorBox.textContent = 'Could not save session. Please try again.';
        errorBox.style.display = 'block';
      }
    }
    return;
  }

  // ─── Priority 3: email verification message (from signup flow) ────
  if (verified === 'true') {
    if (successBox) {
      successBox.textContent = '✅ Email verified! You can now log in.';
      successBox.style.display = 'block';
    }
    window.history.replaceState({}, '', window.location.pathname);
    return;
  }
})();

// ─── Standard email/password login ──────────────────────────
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorBox = document.getElementById('errorBox');
  const loginBtn = document.getElementById('loginBtn');

  // Reset error
  errorBox.style.display = 'none';
  loginBtn.disabled = true;
  loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

  try {
    const response = await fetch('https://rentspace-markeplace.onrender.com/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });

    const data = await response.json();

    if (!response.ok) {
      errorBox.textContent = data.error || 'Invalid email or password. Please try again.';
      errorBox.style.display = 'block';
      loginBtn.disabled = false;
      loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
      return;
    }

    console.log('✅ Login successful, token received:', data.token);

    // ─── Store token ────────────────────────────────────────────
    try {
      localStorage.setItem('rentspace_token', data.token);
      localStorage.setItem('rentspace_user', JSON.stringify(data.user));
      console.log('✅ Token and user stored in localStorage.');
    } catch (storageError) {
      console.error('❌ Failed to store token in localStorage:', storageError);
      errorBox.textContent = 'Could not save login session. Please try again.';
      errorBox.style.display = 'block';
      loginBtn.disabled = false;
      loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
      return;
    }

    // ─── Redirect to dashboard ──────────────────────────────────
    window.location.href = 'dashboard.html';

  } catch (err) {
    console.error('Login fetch error:', err);
    errorBox.textContent = 'Network error. Please check your connection.';
    errorBox.style.display = 'block';
    loginBtn.disabled = false;
    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
  }
});

// Optional: add a manual test helper (visible in console)
console.log('🔑 Login page ready – use the form above or test with:');
console.log(

);
</script>
